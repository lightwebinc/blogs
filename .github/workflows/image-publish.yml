name: image-publish

# Manual, gated image publish. No automated trigger.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RELEASE to publish the images to ghcr.io'
        required: true
      tag:
        description: 'Image tag (e.g. 0.1.0); the git tag v<tag> must exist'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event.inputs.confirm == 'RELEASE'
    runs-on: ubuntu-latest
    steps:
      # Build from the git tag being published: input '0.1.0' -> tag
      # 'v0.1.0'. Checkout fails the run if that tag does not exist.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ github.event.inputs.tag }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push blogs
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/lightwebinc/blogs:${{ github.event.inputs.tag }}
            ghcr.io/lightwebinc/blogs:latest
          build-args: |
            VERSION=${{ github.event.inputs.tag }}

      - name: Build and push blogs-devchain
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: devchain
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/lightwebinc/blogs-devchain:${{ github.event.inputs.tag }}
            ghcr.io/lightwebinc/blogs-devchain:latest
          build-args: |
            VERSION=${{ github.event.inputs.tag }}

      # The host image: the reference overlay host image, named by the
      # repository variable REFERENCE_HOST_IMAGE (an exact tag), with the
      # blogs module built in.
      - name: Build and push blogs-host
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: host/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/lightwebinc/blogs-host:${{ github.event.inputs.tag }}
            ghcr.io/lightwebinc/blogs-host:latest
          build-args: |
            REFERENCE_HOST_IMAGE=${{ vars.REFERENCE_HOST_IMAGE }}
