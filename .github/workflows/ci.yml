name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: [self-hosted, lax]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      - name: gofmt
        run: make fmt-check
      - name: vet
        run: make vet
      # The direct dependencies are exactly go-sdk and bcommon, go.mod is
      # tidy, nothing is replaced, and go-sdk resolves to exactly v1.7.1.
      - name: dependency set
        run: make deps-check
      # LICENSE-THIRD-PARTY is generated from what the binaries link, so a
      # dependency nobody noticed is a license obligation nobody noticed.
      - name: third-party licenses are current
        run: make licences
      # Includes the Go side of the cross-language check: the tests decode
      # and rebuild the vectors the TypeScript codec wrote under testdata/ts.
      - name: test
        run: make go-test
      # Regenerates the Go vectors and compares them byte for byte, so a
      # stale vector or one nothing generates fails here.
      - name: vectors match the Go codec
        run: GOWORK=off go run ./cmd/vectors -check

  # The TypeScript package under host/ runs every Go-generated vector and
  # writes the vectors the Go job reads, so a change that moves the bytes on
  # one side and not the other fails in one job or the other.
  ts:
    runs-on: [self-hosted, lax]
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The runtime major the overlay host runs, which package.json also
          # pins.
          node-version: "24"
          cache: npm
          cache-dependency-path: host/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npm run check
      - name: test
        run: npm test
      - name: vectors match the TypeScript codec
        run: npm run vectors-check

  # The images the quickstart and a deployment run: the command and the
  # local chain, built as the Dockerfile builds them and smoked with no
  # network (the command on its own) and on a private network (the command
  # mining on the local chain, and the chain's journal surviving a restart).
  # The host image is built on the reference overlay host image, which the
  # image-publish workflow names; it is smoked locally with
  # make docker-smoke-host.
  docker:
    runs-on: [self-hosted, lax]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build and smoke the images
        run: make docker-smoke
